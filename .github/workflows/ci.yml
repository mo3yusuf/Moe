name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crave_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - name: Seed is up to date
        run: node scripts/generate-seed.mjs && git diff --exit-code supabase/seed.sql supabase/demo-ids.json
      - name: Core unit tests
        run: npm test -w @crave/core
      - name: Typecheck
        run: npm run typecheck
      - name: Database, RLS and API tests
        run: npm test -w @crave/api
