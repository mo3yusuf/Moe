name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Ensure PostgreSQL server binaries (for database tests)
        # GitHub's Ubuntu images ship PostgreSQL; supabase/tests/run.sh uses the newest installed version.
        # Fall back to the distro's default version rather than pinning one the image may not carry.
        run: |
          if ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            ls -d /usr/lib/postgresql/*/bin
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - name: Build web dashboard
        run: npm run build -w @crave/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Bundle mobile app (Android)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
