# Supabase CLI configuration for LOCAL development (`supabase start`).
# Production settings are managed in the Supabase dashboard.
project_id = "crave"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["crave://", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
# Local only. Production MUST require email confirmation.
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "200MiB"
