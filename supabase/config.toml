# Supabase CLI configuration for local development (`npx supabase start`, requires Docker).
# Unlisted settings use CLI defaults.
project_id = "crave"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["crave://", "http://localhost:8081"]
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = false   # set true for staging/production

[storage]
file_size_limit = "500MiB"
